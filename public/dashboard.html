<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel | Meu Lar</title><link rel="stylesheet" href="/css/style.css">
  <script src="/js/property-catalog.js" defer></script><script src="/js/common.js" defer></script><script src="/js/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Meu Lar<span>Imobiliária</span></a><nav><a href="/" target="_blank" rel="noopener">Ver site público ↗</a><button id="logout" class="secondary" type="button">Sair</button></nav></header>
  <main class="container">
    <p class="eyebrow">ÁREA DO CORRETOR</p><h1>Seu painel de imóveis.</h1><p id="broker"></p>
    <p id="message" role="status" aria-live="polite"></p>
    <section class="panel"><h2>Cadastrar imóvel</h2>
      <form id="property-form" class="property-form">
        <div><label for="title">Título do imóvel</label><input id="title" name="title" placeholder="Apartamento com varanda no centro" minlength="3" maxlength="120" required></div>
        <div><label for="price">Preço (R$)</label><input id="price" name="price" type="number" min="0.01" max="1000000000000" step="0.01" placeholder="350000" required></div>
        <div><label for="property-type">Tipo de imóvel</label><select id="property-type" name="type" required></select></div>
        <div><label for="property-city">Cidade</label><select id="property-city" name="city" required></select></div>
        <div><label for="property-neighborhood">Bairro</label><select id="property-neighborhood" name="neighborhood" required></select></div>
        <div><label for="property-condominium">Condomínio (opcional)</label><select id="property-condominium" name="condominium"></select></div>
        <div class="wide"><label for="description">Descrição</label><textarea id="description" name="description" rows="4" maxlength="5000" required></textarea></div>
        <div class="wide"><label for="photo">Foto do imóvel</label><input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required><small>JPG, PNG ou WebP • Até 5 MB e 25 megapixels</small></div>
        <button type="submit">Cadastrar imóvel</button>
      </form>
    </section>
    <div class="section-title"><h2>Imóveis cadastrados</h2><span id="count"></span></div>
    <p>Dar baixa remove o imóvel da listagem pública. Você pode reativá-lo depois. Excluir remove o cadastro e a foto.</p>
    <section id="properties" class="grid" aria-label="Gerenciar imóveis"></section>
  </main>
</body>
</html>
